version: 2

models:
  - name: orders_t
    description: "Incremental silver-layer orders table, filtered to active records."
    columns:
      - name: order_id
        description: "Primary key for orders."
        data_tests:
          - unique
          - not_null

      - name: is_active
        description: "Active-record flag used for incremental filtering."
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: updated_timestamp
        description: "Source system update timestamp, used as the incremental cursor."
        data_tests:
          - not_null

  - name: products_t
    description: "Incremental silver-layer products table, filtered to active records."
    columns:
      - name: product_id
        description: "Primary key for products."
        data_tests:
          - unique
          - not_null

      - name: is_active
        description: "Active-record flag used for incremental filtering."
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: updated_timestamp
        description: "Source system update timestamp, used as the incremental cursor."
        data_tests:
          - not_null
